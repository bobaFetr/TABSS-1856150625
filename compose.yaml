name: btc-simulation-agent

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AGENT_API_HOST: 0.0.0.0
      AGENT_API_PORT: 8765
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-docker-local-token}
      AGENT_DATA_DIR: /data
      STATE_FILE: /data/agent_state.json
      AP2_SIM_SECRET: ${AP2_SIM_SECRET:-docker-local-ap2-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-nano}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      AUTO_SIM_ENABLED: ${AUTO_SIM_ENABLED:-true}
      AUTO_SIM_POLL_SECONDS: ${AUTO_SIM_POLL_SECONDS:-5}
      AUTO_SIM_SIGNAL_REFRESH_SECONDS: ${AUTO_SIM_SIGNAL_REFRESH_SECONDS:-5}
      AUTO_SIM_STARTING_CASH: ${AUTO_SIM_STARTING_CASH:-500}
      AUTO_SIM_BUY_COOLDOWN_SECONDS: ${AUTO_SIM_BUY_COOLDOWN_SECONDS:-5}
      AUTO_SIM_DROP_TO_BUY_USD: ${AUTO_SIM_DROP_TO_BUY_USD:-25}
      AUTO_SIM_RISE_TO_SELL_USD: ${AUTO_SIM_RISE_TO_SELL_USD:-25}
      AUTO_SIM_FEE_RATE_BPS: ${AUTO_SIM_FEE_RATE_BPS:-10}
      AUTO_SIM_SLIPPAGE_BPS: ${AUTO_SIM_SLIPPAGE_BPS:-2}
      AUTO_SIM_REQUIRE_SIGNAL_CONFIRMATION: ${AUTO_SIM_REQUIRE_SIGNAL_CONFIRMATION:-false}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app
      - agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PY_AGENT_API_URL: http://backend:8765
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-docker-local-token}
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agent-data:
  frontend-node-modules:
  frontend-next-cache:
